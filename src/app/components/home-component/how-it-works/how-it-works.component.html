<section class="py-3 how-it-works">
    <app-title-component subtitle1Key="howitworks.badge" titleKey="howitworks.title.part1"
        subtitle2Key="howitworks.title.part2" subtitleKey="howitworks.subtitle">
    </app-title-component>

    <div class="container">
        <div class="row align-items-center justify-content-center">

            <!-- العمود الشمال -->
            <div class="col-12 col-md-4 d-flex flex-column gap-4">
                <div class="service-card p-4" *ngFor="let service of services.slice(0,2)">
                    <div class="icon-wrapper mb-3">
                        <i class="{{ service.icon }} fa-lg"></i>
                    </div>
                    <h5 class="fw-bold service-title">{{ service.title }}</h5>
                    <p class="service-description">{{ service.description }}</p>
                </div>
            </div>

            <!-- اللوجو -->
            <div class="col-12 col-md-4 text-center my-4 my-md-0 d-none d-md-block">
                <div class="hexagon mb-4 mx-auto">
                    <span class="logo-text">
                        <img src="../../../../assets/logo-new2-transperant.png" alt="Logo" class="img-fluid">
                    </span>
                </div>
            </div>

            <!-- العمود اليمين -->
            <div class="col-12 col-md-4 d-flex flex-column gap-4">
                <div class="service-card p-4" *ngFor="let service of services.slice(2,4)">
                    <div class="icon-wrapper mb-3">
                        <i class="{{ service.icon }} fa-lg"></i>
                    </div>
                    <h5 class="fw-bold">{{ service.title }}</h5>
                    <p class="text-muted">{{ service.description }}</p>
                </div>
            </div>

            <!-- الكارت الخامس -->
            <div class="col-12 col-md-4 mx-auto">
                <div class="service-card p-4">
                    <div class="icon-wrapper mb-3">
                        <i class="{{ services[4].icon }} fa-lg"></i>
                    </div>
                    <h5 class="fw-bold">{{ services[4].title }}</h5>
                    <p class="text-muted">{{ services[4].description }}</p>
                </div>
            </div>

        </div>
    </div>
</section>
