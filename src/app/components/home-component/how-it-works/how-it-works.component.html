<div class="gradient-bg py-5">
  <div class="container">
    <div class="position-relative stepper-container">
      <div class="step-connector connector-1-2 d-none d-md-block"></div>
      <div class="step-connector connector-2-3 d-none d-md-block"></div>
      <div class="step-connector connector-3-4 d-none d-md-block"></div>

      <div class="mobile-connector mobile-connector-1 d-block d-md-none"></div>
      <div class="mobile-connector mobile-connector-2 d-block d-md-none"></div>
      <div class="mobile-connector mobile-connector-3 d-block d-md-none"></div>

      <div class="row step-container row step-container g-5 justify-content-center g-5">

        @for(step of steps; track step; let i =$index){
        <div class="col-12 col-sm-6 col-lg-2">
          <div class="text-center h-100 step-wrapper" [class.zoom-active]="currentStep === i">
            <div class="step-circle">
              <div class="inner-circle">
                <i [class]="step.icon"></i>
              </div>
              <div class="step-number">{{ i + 1}}</div>
            </div>
            <div>
              <h3 class="step-title h5">{{ translationService.translate(step.title) }}</h3>
              <p class="step-description">
                {{ translationService.translate(step.description) }}
              </p>
            </div>
          </div>
        </div>
        }
      </div>
    </div>
  </div>
</div>
