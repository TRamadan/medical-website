<div class="container py-3">
  <h2 class="text-center mb-5">{{ translationService.translate('success.customers.title') }}</h2>
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div id="testimonialCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          @for(item of successStories; track item;){
          <div class="carousel-item active">
            <div class="testimonial-card p-4 p-md-5">
              <i class="bi bi-quote quote-icon position-absolute top-0 start-0 mt-3 ms-3"></i>
              <div class="text-center mb-4">
                <img [src]="imgUrl + item.image" alt="Avatar" class="avatar mb-3">
                <h5 class="mb-1">{{item.name}}</h5>
                <p class="text-muted mb-0">{{ item.titleEn }}</p>
              </div>
              <p class="lead text-center mb-0">{{ item.personDescriptionEn }}
              </p>
            </div>
          </div>
          }

        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#testimonialCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#testimonialCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#testimonialCarousel" data-bs-slide-to="0" class="active"
            aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#testimonialCarousel" data-bs-slide-to="1"
            aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#testimonialCarousel" data-bs-slide-to="2"
            aria-label="Slide 3"></button>
        </div>
      </div>
    </div>
  </div>
</div>
