<section class="upcoming-section">
    <div class="container">
        <div class="row g-4">
            <!-- Main Featured Movie -->
            <div class="col-lg-8">
                <div class="main-card animate-on-scroll">
                    <div class="video-container video-section-overlay">
                        <!-- YouTube Video Player -->
                        <iframe *ngIf="isPlaying && safeVideoUrl" [src]="safeVideoUrl" class="youtube-player"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen>
                        </iframe>

                        <!-- Video Overlay -->
                        <div class="video-overlay" *ngIf="!isPlaying">
                            <div class="play-btn" (click)="playVideo()">
                                <i class="fas fa-play"></i>
                            </div>
                        </div>

                        <!-- Close button when playing -->
                        <div class="close-btn" *ngIf="isPlaying" (click)="stopVideo()">
                            <i class="fas fa-times"></i>
                        </div>
                    </div>
                    <div class="card-content">
                        <h2 class="movie-title">{{ currentLang == 'en' ? selectedVideo.titleEn : selectedVideo.titleAr}}
                        </h2>
                        <!-- <p class="release-date">{{ selectedMovie.date }}</p> -->
                        <p class="movie-description" *ngIf="selectedVideo.descriptionEn">{{ currentLang == 'en' ?
                            selectedVideo.descriptionEn
                            : selectedVideo.descriptionAr }}
                        </p>
                    </div>
                </div>
            </div>

            <!-- Side Content -->
            <div class="col-lg-4 side-videos-content overflow-y-scroll">
                <div class="row g-3">
                    <!-- Featured Side Movies -->
                    @for(video of videos; track video){
                    <div class="col-6 col-md-6 col-lg-12">
                        <div class="side-card animate-on-scroll" (click)="selectContent(video.id)">
                            <div class="side-card-img video-section-overlay video-container">
                                <div class="side-card-overlay">
                                    <div class="side-card-content">
                                        <div class="side-card-title">{{ currentLang == 'en' ? video.titleEn :
                                            video.titleAr }}</div>
                                    </div>
                                </div>
                                <div class="play-overlay">
                                    <i class="fas fa-play"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    }
                </div>
            </div>
        </div>


    </div>
</section>
