<section class="technology-section py-3">
  <div class="container content-wrapper">
    <div class="row justify-content-center">
      <div class="col-12">
        <!-- Header -->
        <app-title-component subtitle1Key="technology.badge" titleKey="technology.title.part1"
          subtitle2Key="technology.title.part2" subtitleKey="technology.subtitle"></app-title-component>

        <!-- Technology Grid -->
        <div class="row g-4 mb-5">
          @for(cuttingEdgeTechnology of CuttingEdgeTechnologySectionSignal(); track cuttingEdgeTechnology){
          <div class="col-lg-4 col-md-6">
            <div class="tech-card">
              <div class="tech-icon-wrapper">
                <div class="tech-icon-bg"></div>
                <div class="tech-icon-container">
                  <i class="fas fa-brain tech-icon"></i>
                </div>
              </div>
              <h3 class="tech-title">{{ currentLang == 'en' ? cuttingEdgeTechnology.titleEn :
                cuttingEdgeTechnology.title }}</h3>
              <p class="tech-description">
                {{currentLang == 'en' ? cuttingEdgeTechnology.descriptionEn : cuttingEdgeTechnology.description }}
              </p>
              <div class="tech-accent"></div>
            </div>
          </div>
          }

        </div>

      </div>
    </div>
  </div>
</section>
