<section class="overflow-hidden">
  <div class="text-center mb-5 fade-in">
    <div class="our-benefits-badge">
      <span>Our Champions</span>
    </div>
  </div>
  <div class="carousel-container position-relative overflow-hidden p-4 p-md-5 rounded-4" (mouseenter)="onMouseEnter()"
    (mouseleave)="onMouseLeave()">
    <div class="row g-3 g-md-4 justify-content-center">
      @for(superstar of getVisibleSlides(); track superstar.id; let i = $index){
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card  border-0 h-100 slide-card" [class.center-slide]="i === 1 && itemsPerSlide === 3"
          [class.side-slide]="i !== 1 && itemsPerSlide === 3">
          <div class="position-relative">
            <img [src]="superstar.image"
              [alt]="translationService.translate('superstars.athletes.' + superstar.key + '.name')"
              class="card-img-top object-fit-cover" style="height: 250px" />

          </div>

          <!-- Card Body -->
          <div class="card-body p-4">
            <h3 class="card-title h4 fw-bold text-dark mb-2">
              {{ superstar.key }}
            </h3>
            <p class="text-primary fw-semibold mb-2">{{superstar.id}}</p>
          </div>
        </div>
      </div>
      }
    </div>

    <!-- Navigation Buttons -->
    <button type="button"
      class="btn btn-primary rounded-circle position-absolute start-0 top-50 translate-middle-y ms-2 nav-btn"
      (click)="prevSlide()" aria-label="Previous slide">
      <i class="fas fa-chevron-left"></i>
    </button>

    <button type="button"
      class="btn btn-primary rounded-circle position-absolute end-0 top-50 translate-middle-y me-2 nav-btn"
      (click)="nextSlide()" aria-label="Next slide">
      <i class="fas fa-chevron-right"></i>
    </button>

    <!-- Progress Indicators -->
    <div class="d-flex justify-content-center mt-5 gap-2">
      @for(superstar of superstars; track superstar.id; let i = $index){
      <button type="button" class="btn p-0 indicator-btn" [class.active]="i === currentSlide" (click)="goToSlide(i)"
        [attr.aria-label]="'Go to slide ' + (i + 1)"></button>
      }
    </div>
  </div>
</section>
