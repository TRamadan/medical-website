<section class="out-team mt-5">
  <div id="teamCarousel" class="carousel slide" data-bs-ride="carousel">
    <!-- Indicators -->
    <div class="carousel-indicators">
      @for (chunk of teamMembersChunk; track chunk; let idx = $index) {
      <button type="button" data-bs-target="#teamCarousel" data-bs-interval="50000" [attr.data-bs-slide-to]="idx"
        [class.active]="idx === 0">
      </button>
      }
    </div>

    <!-- Slides -->
    <div class="carousel-inner">
      @for (chunk of teamMembersChunk; track chunk; let idx = $index) {
      <div class="carousel-item" [class.active]="idx === 0">
        <div class="row g-4 justify-content-center">
          @for (member of chunk; track member) {
          <div class="col-lg-4 col-md-6">
            <div class="card h-100 border-0 shadow-sm">
              <div class="card-body text-center p-4">
                <img [src]="member.image" [alt]="member.name" class="rounded-circle mb-3 team-image"
                  style="width: 96px; height: 96px; object-fit: cover" />
                <h4 class="h5 fw-bold text-dark mb-1">{{ member.name }}</h4>
                <p class="text-primary fw-semibold text-muted mb-2">{{ member.role }}</p>
                <p class="text-muted small mb-3">{{ member.specialization }}</p>
              </div>
            </div>
          </div>
          }
        </div>
      </div>
      }
    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#teamCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#teamCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
</section>
