<section class="our-team">
  <div class="text-center">
    <div class="our-team-badge mt-5">
      <span>{{ translationService.translate('about.team.ordinaryTeam') }}</span>
    </div>
  </div>
  <div class="mb-5">
    <div class="row g-4">
      @for(member of teamMembers; track member; let i = $index){
      <div class="col-xl-3 col-lg-4 col-md-6">
        <div class="card h-100 border-0 shadow-sm">
          <div class="card-body text-center p-4">
            <img [src]="member.image" [alt]="member.name" class="rounded-circle mb-3 team-image"
              style="width: 96px; height: 96px; object-fit: cover" />
            <h4 class="h5 fw-bold text-dark mb-1">{{ member.name }}</h4>
            <p class="text-primary fw-semibold text-muted mb-2">{{ member.role }}</p>
            <p class="text-muted small mb-3">{{ member.specialization }}</p>
          </div>
        </div>
      </div>
      }
    </div>
  </div>
  <div class="col-md-12 text-center my-3">
    <button type="button" class="btn btn-primary btn-lg explore-more-btn border-0">
      Explore more
    </button>
  </div>
</section>
