<!-- FAB button for small screens -->
@if(isSmallScreen){
<div class="fab-container">
    <button class="fab-button" (click)="navigateToBooking()" (mouseenter)="showTooltipHandler()"
        (mouseleave)="hideTooltipHandler()" (focus)="showTooltipHandler()" (blur)="hideTooltipHandler()"
        aria-label="Book an appointment">
        <i class="fas fa-calendar-plus"></i>
    </button>

    <!-- Tooltip -->
    <div class="tooltip" [class.show]="showTooltip">
        Book Appointment
    </div>
</div>
}

<!-- FAB button for large screens -->
@if(!isSmallScreen){
<div class="fab-container fab-container--lg" (mouseenter)="showTooltipHandler()" (mouseleave)="hideTooltipHandler()">
    <button class="fab-button fab-button--lg" (click)="scrollToBookingSection()" (focus)="showTooltipHandler()"
        (blur)="hideTooltipHandler()" aria-label="Scroll to booking section">
        <i class="fas fa-calendar-plus"></i>
    </button>


</div>
}
