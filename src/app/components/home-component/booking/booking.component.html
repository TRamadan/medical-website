<section class="py-5 bg-gradient-to-br">
  <div>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 text-center mb-5">
          <h2 class="display-5 fw-bold text-dark mb-4">
            Book Your Medical Consultation
          </h2>
          <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-6">
              <p class="lead text-muted mb-4">
                Connect with qualified doctors and specialists. Simple booking,
                no login required for first-time appointments.
              </p>
            </div>
          </div>
          <button type="button" class="btn btn-primary btn-lg booking-btn" (click)="startBookingProcess()">
            Book Appointment Now
          </button>
        </div>
      </div>
    </div>
  </div>
  <app-booking-features></app-booking-features>
  <app-booking-how-it-works></app-booking-how-it-works>
  @defer (when showBookingForm){
  <app-booking-form #bookingFormSection>
  </app-booking-form>
  }

</section>
