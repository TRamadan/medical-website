<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-10 col-xl-8">
      <!-- Header -->
      <div class="text-center mb-4">
        <h2 class="h3 fw-bold text-dark mb-2">
          {{ translationService.translate("booking.timeSlot.title") }}
        </h2>
      </div>

      <!-- Date Selection -->
      <div class="card shadow-sm mb-4 border-0">
        <div class="calendar-container">
          <!-- Header with Month & Year Selectors -->
          <div
            class="calendar-header d-flex justify-content-center align-items-center gap-2 mb-2"
          >
            <!-- Month Selector -->
            <div class="form-group">
              <select
                class="form-select"
                [(ngModel)]="selectedMonth"
                (change)="updateCalendar()"
              >
                <option *ngFor="let m of months; let i = index" [ngValue]="i">
                  {{ m }}
                </option>
              </select>
            </div>

            <!-- Year Selector -->
            <div class="form-group">
              <select
                class="form-select"
                [(ngModel)]="selectedYear"
                (change)="updateCalendar()"
              >
                <option *ngFor="let y of years" [ngValue]="y">{{ y }}</option>
              </select>
            </div>

            <!-- Navigation Buttons -->
            <div class="nav-buttons d-flex align-items-center">
              <button
                class="btn btn-outline-secondary btn-sm me-1"
                (click)="prevMonth()"
              >
                <i class="bi bi-chevron-left"></i>
              </button>
              <button
                class="btn btn-outline-secondary btn-sm"
                (click)="nextMonth()"
              >
                <i class="bi bi-chevron-right"></i>
              </button>
            </div>
          </div>

          <!-- Timezone Label -->
          <div class="timezone-label text-primary fw-semibold mb-2">
            Africa/Cairo
          </div>

          <!-- Calendar Grid -->
          <div class="calendar-grid">
            <!-- Weekday Names -->
            <div class="day-name fw-bold text-muted" *ngFor="let d of dayNames">
              {{ d }}
            </div>

            <!-- Days -->
            <div
              *ngFor="let day of calendarDays"
              [ngClass]="{
                'other-month': !day.isCurrentMonth,
                selected: selectedDate === day.dateString
              }"
              (click)="selectDate(day)"
              class="day-cell"
            >
              {{ day.day }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
