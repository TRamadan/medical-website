<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-lg sticky-top">
  <div class="container-fluid">
    <div class="d-flex align-items-center">
      <a class="navbar-brand fw-bold text-primary fs-3" href="#home">
        {{ translationService.translate('brand.name') }}
      </a>
    </div>

    <button class="navbar-toggler border-0 p-0" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen"
      aria-controls="navbarNav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon-custom">
        @if(!isMenuOpen){
        <i class="fas fa-bars text-muted"></i>
        } @else {
        <i class="fas fa-times text-muted"></i>
        }
      </span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="isMenuOpen" id="navbarNav">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        @for(item of mainNavItems; track item){
        <li class="nav-item">
          <a class="nav-link py-2 rounded transition-colors" [href]="item.href" [class.active]="item.active"
            (click)="onNavItemClick(item)">
            {{ item.name }}
          </a>
        </li>
        }
      </ul>

      <div class="d-flex align-items-center">
        <ul class="navbar-nav flex-row">
          <li class="nav-item me-2 me-lg-3">
            <app-language-switcher></app-language-switcher>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>

@if(isMenuOpen){
<div class="navbar-backdrop d-lg-none" (click)="closeMenu()"></div>
}
