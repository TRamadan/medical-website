<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-lg sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold text-primary fs-3" href="#home">
      The sports doctor
    </a>

    <button class="navbar-toggler border-0 p-0" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen"
      aria-controls="navbarNav" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon-custom">
        @if(!isMenuOpen){
        <i class="fas fa-bars text-muted"></i>
        } @else {
        <i class="fas fa-times text-muted"></i>
        }
      </span>
    </button>

    <!-- Collapsible Navigation Content -->
    <div class="collapse navbar-collapse" [class.show]="isMenuOpen" id="navbarNav">
      <!-- Center Navigation Links -->
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
        @for(item of navItems; track item){
        <li class="nav-item">
          <a class="nav-link px-3 py-2 rounded transition-colors" [href]="item.href" [class.active]="item.active"
            (click)="onNavItemClick(item)">
            {{ item.name }}
          </a>
        </li>
        }
      </ul>

      <!-- Right Side Content -->
      <div class="navbar-nav ms-auto">
        <!-- CTA Button -->
        <div class="nav-item">
          <button type="button" class="btn btn-primary px-4 py-2 rounded-pill" (click)="onBookAppointment()">
            <i class="fas fa-calendar-plus me-2 d-none d-sm-inline"></i>
            Book Appointment
          </button>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Mobile Menu Overlay (for better UX) -->
@if(isMenuOpen){
<div class="navbar-backdrop d-lg-none" (click)="closeMenu()"></div>
}
