<nav class="navbar navbar-expand-lg navbar-custom navbar-transparent" id="navbar" [class.navbar-scrolled]="isScrolled"
  [class.navbar-transparent]="!isScrolled">
  <div class="container-fluid">
    <!-- Logo/Brand -->
    <a class="navbar-brand navbar-brand-custom" href="#">RehabApp</a>

    <!-- Mobile menu toggle -->
    <button class="navbar-toggler navbar-toggler-custom" type="button" data-bs-toggle="collapse"
      data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon navbar-toggler-icon-custom"></span>
    </button>

    <!-- Navigation items -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto navbar-nav-desktop">
        @for(item of mainNavItems; track item;){
        <li class="nav-item">
          <a class="nav-link py-2 nav-link-custom" [href]="item.href" [class.active]="item.active"
            (click)="onNavItemClick(item)">
            {{ item.name }}
          </a>
        </li>
        }
      </ul>
      <div class="d-flex">
        <app-language-switcher />
      </div>
    </div>
  </div>
</nav>
