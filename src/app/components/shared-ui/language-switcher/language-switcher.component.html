<button class="btn btn-outline-light btn-sm" id="languageBtn" (click)="toggleLanguage()"
    [attr.aria-label]="'Switch to ' + (currentLanguage === 'en' ? 'Arabic' : 'English')">
    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="me-2">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9">
        </path>
    </svg>
    <span class="language-flag me-1">{{ getLanguageFlag() }}</span>
    <span class="language-text">{{ getLanguageText() }}</span>
</button>
