<app-landing-page *ngIf="isLoading"></app-landing-page>

<div [hidden]="isLoading">
    <app-header *ngIf="showHeaderFooter" />
    <router-outlet />
    <app-footer *ngIf="showHeaderFooter" />

    <!-- Global FAB button - only shown on mobile and non-auth pages -->
    <div class="fab-container" *ngIf="showFab && showHeaderFooter">
        <!-- Animated tooltip -->
        <div class="tooltip" [class.show]="showTooltip" [class.hide]="!showTooltip">
            Book Now!
        </div>

        <!-- FAB button -->
        <button class="fab-button" (click)="navigateToBooking()" aria-label="Book appointment">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3ZM19 19H5V8H19V19ZM7 10H12V15H7V10Z"
                    fill="currentColor" />
            </svg>
        </button>
    </div>
</div>
